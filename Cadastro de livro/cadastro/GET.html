<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Catálogo de livros</h1>
    <nav>
        <ul>
            <li><a href="POST.html">Cadastrar livro</a></li>
            <li><a href="GET.html">Listar livros</a></li>

        </ul>
    </nav>
    <button id="btn"> Listar livros </button>


    <div class="container">
        <div class="coluna">
            <h3> Autores </h3>
            <div id="listar-autores"> </div>

        </div>


        <div class="coluna">
            <h3> Livros </h3>
            <div id="listar-livros"></div>
        </div>

        <script>
            //listar livros
            let listarautores = document.getElementById("listar-autores")
            let listarlivros = document.getElementById("listar-livros")
            let btn = document.getElementById("btn")
            const API = "https://livros.acilab.com.br/api/livros";
            function listarLivros() {
                fetch(API, { method: "GET" })

                    .then(response => response.json())
                    .then(data => {
                        listarlivros.innerHTML = ""
                        listarautores.innerHTML = ""
                        for (let i = 0; i < data.length; i++) {

                            listarautores.innerHTML += `${data[i].autor} <br>`
                            listarlivros.innerHTML += `${data[i].titulo} 
                        <button onclick= 'excluirLivro(${data[i].id})'>X</button>
                       <input type="button" value="Editar" onclick="Editarlivros('${data[i].id}', '${data[i].titulo}', '${data[i].autor}')">
                        <br>`

                        }

                        console.log(data)
                    })
            }
            btn.addEventListener("click", () => {
                listarLivros()
            })

            //excluir livro
            function excluirLivro(id) {
                if (confirm("Deseja realmente excluir este livro?")) {
                    fetch(`${API}/${id}`, {
                        method: "DELETE"
                    })
                        .then(response => {
                            if (response.ok) {
                                listarLivros();
                            } else {
                                alert("Erro ao excluir o livro.");
                            }
                        })
                        .catch(error => console.error("Erro na exclusão:", error));
                }
            }

            //editar livro
            function Editarlivros(id, titulo, autor) {
                const novotitulo = titulo//input("Novo titulo", titulo)
                const novoautor = autor//input("Novo autor", autor)
                if (titulo && autor) {
                    fetch(`${API}/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            id: id,
                            titulo: novotitulo,
                            autor: novoautor
                        })
                    })
                        .then(response => {
                            if (response.ok) {
                                listarLivros()
                            } else {
                                alert("Erro ao editar o livro")
                            }
                        })
                        .catch(error => console.error("Erro na edição", error))
                }
            }

            btn.addEventListener("click", listarLivros)

        </script>
</body>

</html>
